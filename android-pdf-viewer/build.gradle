apply plugin: 'com.android.library'
apply plugin: 'maven-publish'


android {
    namespace 'com.github.barteksc.pdfviewer'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionName "3.2.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Configure packaging for 16 KB page size compatibility.
    // Native libraries should be stored uncompressed and page-aligned in the APK.
    packagingOptions {
        jniLibs {
            // Setting to false ensures native libraries are stored uncompressed and aligned.
            // This is the default for AGP 3.6+ but explicitly set for clarity.
            useLegacyPackaging false
        }
    }

    // Enable 16 KB page size support for native libraries
    ndkVersion "28.0.12433566"  // Use NDK r28+ for 16 KB support

    // Disable lint for now to focus on 16 KB compatibility
    lint {
        abortOnError false
    }

    // Declare the release variant for publishing; AGP 8.x no longer creates
    // the software component automatically without this.
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }

}

dependencies {
    implementation 'androidx.core:core:1.17.0'
//    api 'io.github.oothp:pdfium-android:1.9.5-beta01'
    api 'com.github.v-mas:PdfiumAndroid:1.9.5'
}

// JitPack passes -Pgroup / -Pversion on the command line; fall back to local defaults.
def jitpackGroup = 'com.github.shixingxing'
def jitpackVersion = '3.2.1'

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = jitpackGroup
                artifactId = 'android-pdf-viewer'
                version = jitpackVersion
            }
        }
    }
}

